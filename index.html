<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>성당 — 온라인 성당</title>
<style>
  html,body{margin:0;height:100%;background:#d2cbbb;color:#2b2519;font:14px/1.5 system-ui,sans-serif;overflow:hidden}
  canvas{display:block;touch-action:none}
  #ui{position:fixed;left:0;right:0;bottom:12px;text-align:center;pointer-events:none}
  #ui button[hidden]{display:none}
  #ui button{pointer-events:auto;margin:0 4px;padding:8px 16px;border:1px solid #8a7a55;border-radius:20px;background:#fffaf0cc;color:inherit;font:inherit}
  #pick{position:fixed;top:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:70vw}
  #pick button{padding:6px 12px;border:1px solid #8a7a55;border-radius:16px;background:#fffaf0cc;color:inherit;font:inherit;font-size:12px}
  #pick button.on{background:#5a4a2a;color:#fff}
  #toast{position:fixed;top:56px;left:50%;transform:translateX(-50%);padding:8px 16px;border-radius:16px;background:#2b2519dd;color:#fff;font-size:13px;opacity:0;transition:opacity .4s;pointer-events:none}
  #net{position:fixed;top:10px;left:10px;padding:4px 10px;border-radius:12px;background:#fffaf0cc;border:1px solid #8a7a55;font-size:12px;max-width:42vw}
  #gbp{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,380px);max-height:80vh;display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:14px;background:#fffaf0f2;border:1px solid #8a7a55;box-shadow:0 6px 24px #0005}
  #gbp[hidden]{display:none}
  #gbl{overflow:auto;max-height:42vh;display:flex;flex-direction:column;gap:6px}
  #gbl div{padding:6px 8px;border-radius:8px;background:#f1e8d4;font-size:13px;word-break:break-word}
  #gbl small{opacity:.6}
  #gbp input,#gbp button{font:inherit;padding:7px 10px;border:1px solid #8a7a55;border-radius:10px;background:#fff;color:inherit}
  #hint{opacity:.7;margin-top:8px;font-size:12px}
</style>
</head>
<body>
<div id="net">실시간 확인 중…</div>
<div id="pick"></div>
<div id="gbp" hidden><b>고해성사실 방명록</b><div id="gbl"></div><input id="gbn" maxlength="12" placeholder="이름(별명)"><input id="gbm" maxlength="100" placeholder="한 줄 남기기 (개인정보는 쓰지 마세요)"><div style="display:flex;gap:6px"><button id="gbs" style="flex:1">남기기</button><button id="gbx">닫기</button></div><small id="gbi" style="opacity:.6"></small></div>
<div id="toast"></div>
<div id="ui">
  <button id="veil">미사보: 없음</button>
  <button id="bell">종 울리기</button>
  <button id="hymn">성가 듣기</button>
  <button id="asmr">자연 소리 ASMR 듣기</button>
  <button id="pray" hidden>기도하기</button>
  <button id="stand" hidden>일어나기</button>
  <button id="gb" hidden>방명록</button>
  <button id="exit" hidden>나오기</button>
  <div id="hint">바닥 클릭 · WASD · 방향키로 이동 / 의자를 클릭하면 앉아요 / 드래그로 둘러보기</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.3.4/mqtt.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd2cbbb);
scene.fog = new THREE.Fog(0xd2cbbb, 25, 80);
const cam = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 100);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const mat = c => new THREE.MeshStandardMaterial({ color: c, roughness: .9, side: THREE.DoubleSide });
const texReg = [];
const canvasTex = (w, h, draw, rx, ry) => {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry);
  texReg.push({ c, draw, t }); return t;
};
// ---------- 성당 스타일 (참고 사진 5장) ----------
const CH = {
  myeongdong: { name: '명동성당', bg: 0xd2cbbb, wall: '#e9e0cc', vaultCol: '#e9e0cc', vault: 'pointed', ribs: 'cross', ribBrick: 'gray', pier: 'gray', aisles: true,
    floor: 'diamond', floorA: '#bdbab0', floorB: '#8f8c82', pew: '#7a4a26', glass: ['#3f6fc4', ['#c8a33a', '#b53a3a', '#7fb0e8']], win: 'lancet', altar: 'myeong', light: [0xfff6e6, 0x8b7d68, .8] },
  village: { name: '푸른 벽돌 성당', bg: 0xe8dcc8, wall: '#f3ead8', vaultCol: '#f3dcc0', vault: 'round', ribs: 'transverse', ribBrick: 'blue', pier: 'blue',
    floor: 'wood', floorA: '#c98a4a', floorB: '#a8672f', pew: '#9a5a28', glass: ['#e0b030', ['#d04a3a', '#3a78d0', '#3aa05a']], win: 'arched', altar: 'village', light: [0xfff2dc, 0x9a8264, 1] },
  blackbrick: { name: '검은 벽돌 성당', bg: 0xe6e2da, wall: '#f4f1ea', vaultCol: '#f6f3ec', vault: 'round', ribs: 'transverse', ribBrick: 'black', pier: 'black',
    floor: 'plain', floorA: '#b8b2a4', pew: '#8a5530', glass: ['#e8c040', ['#3aa070', '#d0503a', '#4a80d0']], win: 'arched', altar: 'black', light: [0xfff6e6, 0x8b7d68, .95], chandelier: true },
  plain: { name: '분홍빛 소성당', bg: 0xe3d6d0, wall: '#e6cfc6', vaultCol: '#e8dccf', vault: 'barrel', ribs: 'none', pier: null,
    floor: 'wood', floorA: '#a87c52', floorB: '#8a6038', pew: '#8a4e24', glass: ['#d86a50', ['#e8a040', '#c04040', '#4a78c8']], win: 'arched', altar: 'plain', light: [0xfff0e6, 0x8f7a6c, 1] },
  hanoi: { name: '고딕 대성당', bg: 0xdcd6cc, wall: '#f1efe9', vaultCol: '#bcd3ca', vault: 'pointed', ribs: 'cross', ribBrick: 'rust', pier: 'white', aisles: true,
    floor: 'plain', floorA: '#9a948a', pew: '#4a2a1a', glass: ['#3a68b8', ['#e0b030', '#c03a3a', '#4aa070']], win: 'lancet', altar: 'hanoi', light: [0xfff6e6, 0x7a6e60, .85], chandelier: true },
};
let cur = 'myeongdong', world = null;
const seats = [], benchMeshes = [], fonts = [], boothDoors = [], booths = [];
const std = map => new THREE.MeshStandardMaterial({ roughness: 1, side: THREE.DoubleSide, map });
const BRICKS = {
  gray: { mortar: '#8b8780', h: 35, s: 6, l: 52, v: 10 }, blue: { mortar: '#e6edf4', h: 215, s: 22, l: 55, v: 10 },
  black: { mortar: '#d8d6d0', h: 0, s: 0, l: 14, v: 6 }, white: { mortar: '#efece4', h: 40, s: 20, l: 92, v: 3 },
  rust: { mortar: '#7a3f24', h: 15, s: 45, l: 34, v: 4 },
};
const brickMat = (rx, ry, k) => std(canvasTex(128, 128, (g, w, h) => {
  g.fillStyle = k.mortar; g.fillRect(0, 0, w, h);
  for (let r = 0; r < 8; r++) for (let c = 0; c < 4; c++) {
    g.fillStyle = `hsl(${k.h},${k.s}%,${k.l + Math.random() * k.v}%)`; g.fillRect(c * 32 + (r % 2) * 16 + 1, r * 16 + 1, 30, 14);
  }
}, rx, ry));
const flat = (rx, ry, col) => std(canvasTex(64, 64, (g, w, h) => { g.fillStyle = col; g.fillRect(0, 0, w, h); }, rx, ry));
const woodMat = (rx, ry, C) => std(canvasTex(128, 128, (g, w, h) => {
  g.fillStyle = C.pew; g.fillRect(0, 0, w, h); g.strokeStyle = 'rgba(0,0,0,.18)';
  for (let y = 6; y < h; y += 14) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y + 2); g.stroke(); }
}, rx, ry));
function floorMat(C) {
  const draw = {
    diamond: (g, w, h) => {
      g.fillStyle = C.floorA; g.fillRect(0, 0, w, h); g.strokeStyle = C.floorB; g.lineWidth = 3;
      g.beginPath(); g.moveTo(w / 2, 0); g.lineTo(w, h / 2); g.lineTo(w / 2, h); g.lineTo(0, h / 2); g.closePath(); g.stroke();
    },
    wood: (g, w, h) => {
      g.fillStyle = C.floorA; g.fillRect(0, 0, w, h); g.strokeStyle = C.floorB; g.lineWidth = 2;
      for (let x = 0; x < w; x += 32) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
    },
    plain: (g, w, h) => { g.fillStyle = C.floorA; g.fillRect(0, 0, w, h); g.strokeStyle = 'rgba(0,0,0,.12)'; g.strokeRect(0, 0, w, h); },
  }[C.floor];
  const rep = { diamond: [8, 25], wood: [3, 12], plain: [6, 20] }[C.floor];
  return new THREE.MeshStandardMaterial({ roughness: .6, map: canvasTex(128, 128, draw, ...rep) });
}
function glassMat(C) {
  const t = canvasTex(64, 256, (g, w, h) => {
    g.fillStyle = C.glass[0]; g.fillRect(0, 0, w, h);
    for (let y = 0; y < h; y += 32) for (let x = 0; x < w; x += 32) if (Math.random() < .35) { g.fillStyle = C.glass[1][Math.random() * 3 | 0]; g.fillRect(x, y, 32, 32); }
    g.strokeStyle = '#1d2c4a'; g.lineWidth = 3;
    for (let y = 0; y <= h; y += 32) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
    g.beginPath(); g.moveTo(w / 2, 0); g.lineTo(w / 2, h); g.stroke();
  }, 1, 1);
  t.repeat.set(1 / 1.4, 1 / 4); // 창 UV는 월드 단위
  return new THREE.MeshBasicMaterial({ map: t, side: THREE.DoubleSide });
}

// 뾰족 아치 띠(고딕): 폭 w, 두께 th, 깊이 depth. 아치 평면은 xy, 깊이는 +z
function pointedBand(w, th, depth) {
  const pt = (R, a) => [w / 2 + R * Math.cos(a), R * Math.sin(a)];
  const a0 = Math.PI, a1 = 2 * Math.PI / 3, ai = Math.acos(-w / (2 * (w - th))), N = 14;
  const arc = (R, from, to) => Array.from({ length: N + 1 }, (_, i) => pt(R, from + (to - from) * i / N));
  const L = arc(w, a0, a1), Li = arc(w - th, a0, ai);
  const sh = new THREE.Shape();
  sh.moveTo(...L[0]); L.slice(1).forEach(p => sh.lineTo(...p));
  L.slice().reverse().slice(1).forEach(p => sh.lineTo(-p[0], p[1]));
  sh.lineTo(w / 2 - th, 0);
  Li.slice().reverse().forEach(p => sh.lineTo(-p[0], p[1]));
  Li.slice(1).forEach(p => sh.lineTo(...p));
  return new THREE.ExtrudeGeometry(sh, { depth, bevelEnabled: false });
}
// 반원 아치 띠
function roundBand(w, th, depth) {
  const R = w / 2, N = 20, sh = new THREE.Shape(); sh.moveTo(-R, 0);
  for (let i = 1; i <= N; i++) { const a = Math.PI - Math.PI * i / N; sh.lineTo(R * Math.cos(a), R * Math.sin(a)); }
  sh.lineTo(R - th, 0);
  for (let i = N - 1; i >= 0; i--) { const a = Math.PI - Math.PI * i / N; sh.lineTo((R - th) * Math.cos(a), (R - th) * Math.sin(a)); }
  return new THREE.ExtrudeGeometry(sh, { depth, bevelEnabled: false });
}
// 첨두창(란셋)과 반원창
function lancet(w, h, m) {
  const sh = new THREE.Shape(); sh.moveTo(-w / 2, 0); sh.lineTo(w / 2, 0); sh.lineTo(w / 2, h);
  sh.quadraticCurveTo(w / 2, h + w * .8, 0, h + w * .9); sh.quadraticCurveTo(-w / 2, h + w * .8, -w / 2, h);
  return new THREE.Mesh(new THREE.ShapeGeometry(sh), m);
}
function arched(w, h, m) {
  const sh = new THREE.Shape(); sh.moveTo(-w / 2, 0); sh.lineTo(w / 2, 0); sh.lineTo(w / 2, h); sh.absarc(0, h, w / 2, 0, Math.PI, false); sh.lineTo(-w / 2, 0);
  return new THREE.Mesh(new THREE.ShapeGeometry(sh), m);
}

function buildChurch(key) {
  const C = CH[key]; cur = key;
  if (world) { scene.remove(world); world.traverse(o => o.geometry && o.geometry.dispose()); }
  texReg.length = 0;
  world = new THREE.Group(); scene.add(world);
  scene.background.set(C.bg); scene.fog.color.set(C.bg);
  seats.length = 0; benchMeshes.length = 0; fonts.length = 0; boothDoors.length = 0; booths.length = 0;
  const add = (geo, m, x, y, z) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); world.add(o); return o; };
  const put = (o, x, y, z, ry = 0) => { o.position.set(x, y, z); o.rotation.y = ry; world.add(o); return o; };
  const wall = (rx, ry) => flat(rx, ry, C.wall);
  const gl = glassMat(C), ribM = C.ribBrick && brickMat(.5, .5, BRICKS[C.ribBrick]);
  const win = (w, h) => (C.win === 'lancet' ? lancet : arched)(w, h, gl);
  const spring = { pointed: 14, round: 10, barrel: 11 }[C.vault], W = C.aisles ? 16 : 9;

  add(new THREE.PlaneGeometry(W, 50), floorMat(C), 0, 0, 0).rotation.x = -Math.PI / 2;
  add(new THREE.BoxGeometry(W, 22, .4), wall(4, 5), 0, 11, 25);
  add(new THREE.BoxGeometry(W, 22, .4), wall(4, 5), 0, 11, -25);

  // 천장(볼트)
  const vg = C.vault === 'pointed' ? pointedBand(8, .3, 50) : roundBand(8, .3, 50);
  const vault = new THREE.Mesh(vg, flat(1, 1, C.vaultCol)); vault.position.set(0, spring, -25);
  if (C.vault === 'barrel') vault.scale.y = .4; world.add(vault);

  if (C.aisles) {  // 측랑 + 아케이드 + 고창 (명동성당, 고딕 대성당)
    for (const s of [-1, 1]) {
      add(new THREE.PlaneGeometry(4.4, 50), wall(2, 12), s * 6, 9, 0).rotation.x = Math.PI / 2;
      add(new THREE.BoxGeometry(.4, 9, 50), wall(12, 3), s * 8, 4.5, 0);
      add(new THREE.BoxGeometry(.4, 5, 50), wall(12, 2), s * 4, 11.5, 0);
      for (let z = -22; z <= 22; z += 4) if (z !== 18) put(win(1, 3), s * 7.75, 3, z, -s * Math.PI / 2);
    }
    const pierM = brickMat(1, 7, BRICKS[C.pier]);
    for (let z = -20; z <= 20; z += 5) {
      put(new THREE.Mesh(pointedBand(8, .8, .6), ribM), 0, 14, z - .3);
      for (const s of [-1, 1]) {
        add(new THREE.BoxGeometry(1.1, 14, 1.1), pierM, s * 4, 7, z);
        if (C.pier === 'white') add(new THREE.BoxGeometry(1.6, .35, 1.6), flat(1, 1, '#f6f4ee'), s * 4, 8.5, z);
        if (z < 20) {
          put(new THREE.Mesh(pointedBand(5, .55, .9), flat(1, 1, C.pier === 'white' ? '#f4f2ec' : '#8b8780')), s * 4 - .45, 6, z + 2.5, Math.PI / 2);
          for (const dz of [1.1, 3.9]) put(win(1, 2.6), s * 3.78, 10.6, z + dz, -s * Math.PI / 2);
          for (const [a, b] of [[-4, 4], [4, -4]]) {
            const c = new THREE.QuadraticBezierCurve3(new THREE.Vector3(a, 14, z), new THREE.Vector3(0, 25, z + 2.5), new THREE.Vector3(b, 14, z + 5));
            add(new THREE.TubeGeometry(c, 20, .09, 6), ribM, 0, 0, 0);
          }
        }
      }
    }
  } else {  // 측랑 없는 성당: 벽 + 벽기둥 + 반원 아치 리브
    for (const s of [-1, 1]) add(new THREE.BoxGeometry(.4, spring, 50), wall(12, 3), s * 4.2, spring / 2, 0);
    for (let z = -20; z <= 20; z += 5) {
      if (C.ribs === 'transverse') put(new THREE.Mesh(roundBand(8, .8, .6), ribM), 0, spring, z - .3);
      for (const s of [-1, 1]) if (C.pier) add(new THREE.BoxGeometry(.9, spring, .9), brickMat(1, 5, BRICKS[C.pier]), s * 3.65, spring / 2, z);
    }
    for (const s of [-1, 1]) for (let z = -20; z < 20; z += 5) if (z !== 15) put(win(1.3, 3.2), s * 3.98, 3.6, z + 2.5, -s * Math.PI / 2);
  }

  // 제단: 단 + 카펫 + 제대 + 성당마다 다른 뒷벽
  const gold = mat(0xd9b44a), brown = mat(0x6e4224);
  const cross = (x, y, z, h = 2.2, w = 1.2, m = gold) => { add(new THREE.BoxGeometry(.15, h, .15), m, x, y, z); add(new THREE.BoxGeometry(w, .15, .15), m, x, y + h * .25, z); };
  add(new THREE.BoxGeometry(9, .3, 6.5), mat(0xcfc8b8), 0, .15, -21.5);
  add(new THREE.BoxGeometry(2.4, .02, 3.2), mat(0x9a1a1a), 0, .01, -17.6);
  add(new THREE.BoxGeometry(3, 1, 1.4), mat(0xf0ece2), 0, .8, -21);
  if (C.altar === 'myeong') {
    cross(0, 3.9, -23); add(new THREE.BoxGeometry(7, 6, .4), mat(0xcdb88a), 0, 3.3, -24.6);
    for (let i = -3; i <= 3; i++) put(lancet(.6, 1.6, mat(0x5a4328)), i * .95, 2.2, -24.38);
    [[-3, 3.4], [-1.5, 4.4], [0, 5.4], [1.5, 4.4], [3, 3.4]].forEach(([x, h]) => put(lancet(1.1, h, gl), x, 7.5, -24.78));
  } else if (C.altar === 'village') {
    for (const x of [-3, 3]) { put(arched(1.4, 2.4, brown), x, 0, -24.78); add(new THREE.BoxGeometry(.5, 1.3, .35), mat(0xe8e0d0), x * 1.1, 3.8, -24.6); }
    cross(0, 4.4, -24.7, 2.6, 1.4);
    for (let i = -2; i <= 2; i++) add(new THREE.CylinderGeometry(.04, .04, .7, 6), mat(0xfff2c0), i * .5, 1.5, -21.2);
  } else if (C.altar === 'black') {
    [[-2.6, 4.6], [0, 6], [2.6, 4.6]].forEach(([x, h]) => put(arched(1.5, h, gl), x, 3.4, -24.78));
    cross(0, 2.6, -24.7, 1.8, 1);
  } else if (C.altar === 'plain') {
    put(arched(5, 4, mat(0xf3e8d8)), 0, 1.5, -24.78); cross(0, 4.4, -24.7, 3.4, 1.9, mat(0x6a3f1f));
    for (const x of [-3.2, 3.2]) put(arched(1.2, 3.4, gl), x, 3, -24.78);
  } else if (C.altar === 'hanoi') {
    add(new THREE.BoxGeometry(7.5, 10, .5), mat(0xc9a24a), 0, 5, -24.6);
    for (let i = -2; i <= 2; i++) put(lancet(.8, 2.4, mat(0x6a4a22)), i * 1.3, 2.4, -24.3);
    [[-2, 3.4], [0, 5.4], [2, 3.4]].forEach(([x, h]) => put(lancet(1.1, h, gl), x, 11, -24.78));
    cross(0, 6.2, -24.2, 2, 1.2);
  }

  // 뒤쪽 출입문(비상구 표시)과 성수대 두 곳
  put(arched(3, 3.2, mat(0xd8d0bc)), 0, 0, 24.79);
  put(arched(2.6, 3, mat(0x5a3a1e)), 0, 0, 24.77);
  add(new THREE.BoxGeometry(.04, 2.9, .02), mat(0x2a1a0c), 0, 1.45, 24.75);
  for (const x of [-.25, .25]) add(new THREE.BoxGeometry(.08, .08, .06), gold, x, 1.2, 24.74);
  add(new THREE.BoxGeometry(.9, .35, .05), new THREE.MeshBasicMaterial({ color: 0x2fae5a }), 0, 4.1, 24.76);
  const stone = mat(0xb9b2a4);
  for (const x of [-2.1, 2.1]) {
    fonts.push(add(new THREE.CylinderGeometry(.22, .28, .9, 12), stone, x, .45, 24.2),
               add(new THREE.CylinderGeometry(.42, .26, .2, 16), stone, x, .98, 24.2));
    add(new THREE.CylinderGeometry(.34, .34, .02, 16), new THREE.MeshBasicMaterial({ color: 0x7fb4d8 }), x, 1.06, 24.2);
  }

  // 고해성사실: 좌우 벽 속에 고해자 방 하나 + 신부님 방 하나(문 두 개, 안내판, 표시등). 측랑이 있으면 측랑 바깥 벽, 없으면 양옆 벽
  const wd = mat(0x4a2c16), wallX = C.aisles ? 7.8 : 4.0;
  const sign = txt => { const t = new THREE.CanvasTexture(Object.assign(document.createElement('canvas'), { width: 256, height: 80 }));
    const g = t.image.getContext('2d'); g.fillStyle = '#1f8a6a'; g.fillRect(0, 0, 256, 80); g.fillStyle = '#fff'; g.font = 'bold 44px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(txt, 128, 42);
    return new THREE.MeshBasicMaterial({ map: t }); };
  const signs = { P: sign('고해자'), R: sign('신부님') };
  for (const s of [-1, 1]) {

const guests = new Map(); let renderGuests = () => {};

const mqNet = (() => {
  const prefix = 'hachohee-church-v1/', id = Math.random().toString(36).slice(2, 10), others = new Map();
  const urls = ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt'];
  let client = null, ok = false, last = 0, lastStr = '';
  function connect(i = 0) {
    if (!window.mqtt || i >= urls.length) return;
    let alive = false;
    let c; try { c = mqtt.connect(urls[i], { connectTimeout: 6000, reconnectPeriod: 3000, clientId: 'ch_' + id, will: { topic: prefix + id, payload: '' } }); } catch (e) { return connect(i + 1); }  // 보안 설정이 외부 접속을 막으면 여기로 옴
    c.on('connect', () => { alive = true; ok = true; client = c; c.subscribe(prefix + '+'); c.subscribe(prefix + 'guest/+'); });

      const pid = t.slice(prefix.length); if (pid === id || m.length > 300) return;  // 공개 채널이라 남이 보낸 값은 믿지 않음

      try { others.set(pid, { presence: JSON.parse(m.toString()), t: Date.now() }); } catch (e) {}

    c.on('error', () => {});

    guestPublish(gid, o) { if (!client || !ok) return false; client.publish(prefix + 'guest/' + gid, JSON.stringify(o), { retain: true, qos: 1 }); return true; },
    presence(p) {  // 바뀌면 최대 10번/초, 안 바뀌어도 2초마다 생존 신호
      const s = JSON.stringify(p), now = Date.now();

  if (boothSide) {  // 고해성사실 안: 1인칭으로 격자창을 바라봄
    const b = booths.find(x => x.s === boothSide.s);
    cam.position.set(b.x - boothSide.s * .25, 1.3, boothSide.z + (boothSide.role === 'P' ? .4 : -.4)); cam.rotation.order = 'YXZ'; cam.rotation.set(.12 - pitch, yaw, 0);
  } else {
    const t = new THREE.Vector3(pos.x, 1.3, pos.z), d = 4;
    cam.position.set(t.x + Math.sin(yaw) * Math.cos(pitch) * d, Math.max(.4, t.y + Math.sin(pitch) * d), t.z + Math.cos(yaw) * Math.cos(pitch) * d);
    cam.position.x = Math.max(-3.4, Math.min(3.4, cam.position.x));
    cam.position.z = Math.min(24.4, cam.position.z);
    cam.lookAt(t);
  }

  const nt = net();
  if (nt) {
    const mine = { x: +pos.x.toFixed(2), z: +pos.z.toFixed(2), yaw: +faceYaw.v.toFixed(2), seat: seated, pray: pr, hue: +hue.toFixed(2), church: cur, veil: myVeil, hide: boothSide ? 1 : 0 };
    const k = JSON.stringify(mine);
    if (nt === mqNet) mqNet.presence(mine); else if (k !== lastSent) { lastSent = k; room.presence(mine); }
    const live = {};
    for (const p of nt.peers()) {
      if (p.isMe) continue;
      const q = p.presence; if (!Number.isFinite(q.x) || !Number.isFinite(q.z) || q.church !== cur) continue;
      const av = live[p.peer] = others[p.peer] || makeAvatar(+q.hue || 0);
      const st = q.seat >= 0 && seats[q.seat];
      const tx = st ? st.x : Math.max(-4, Math.min(4, q.x)), tz = st ? st.z : Math.max(-25, Math.min(25, q.z));
      const cx = av.position.x + (tx - av.position.x) * .25, cz = av.position.z + (tz - av.position.z) * .25;
      av.visible = !q.hide; const qv = q.veil === 1 || q.veil === 2 ? q.veil : 0; if (av.veilV !== qv) setVeil(av, qv);
      pose(av, st ? tx : cx, st ? tz : cz, st ? 0 : +q.yaw || 0, st ? q.seat : -1, q.pray);
    }
    for (const id in others) if (!live[id]) scene.remove(others[id]);
    others = live;
  }
  renderer.render(scene, cam);
  requestAnimationFrame(loop);
})();

// 소리: 파일 없이 WebAudio로 합성 (종 + 오르간 화음)
let ac;
const ctx = () => ac || (ac = new (window.AudioContext || window.webkitAudioContext)());
document.getElementById('bell').onclick = () => {
  const a = ctx(), t = a.currentTime, g = a.createGain();
  g.gain.setValueAtTime(.25, t); g.gain.exponentialRampToValueAtTime(.001, t + 5); g.connect(a.destination);
  [220, 440, 553, 661, 880].forEach((f, i) => {
    const o = a.createOscillator(); o.frequency.value = f * (1 + i * .002); o.connect(g); o.start(t); o.stop(t + 5);
  });
};
// 성가·기도소리: 페이지 안에서 WebAudio로 합성(외부 파일·유튜브 없음). 내 기기에서만 들림. 리버브로 성당 울림을 줌
function sound(btn, label, build, wetLevel = .7) {
  let stop = null;
  btn.onclick = () => {
    if (stop) { stop(); stop = null; btn.textContent = label + ' 듣기'; return; }
    const a = ctx(); if (a.state === 'suspended') a.resume();
    const out = a.createGain(); out.gain.value = 0; out.gain.linearRampToValueAtTime(1, a.currentTime + 3);
    const rev = a.createConvolver(), n = a.sampleRate * 3.5, ir = a.createBuffer(2, n, a.sampleRate);
    for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.5); }
    rev.buffer = ir; const wet = a.createGain(); wet.gain.value = wetLevel;
    out.connect(a.destination); out.connect(rev); rev.connect(wet); wet.connect(a.destination);
    const end = build(a, out);
    stop = () => { out.gain.cancelScheduledValues(a.currentTime); out.gain.setTargetAtTime(0, a.currentTime, .6); setTimeout(() => { end(); out.disconnect(); }, 2500); };
    btn.textContent = label + ' 끄기';
  };
}
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
// 성가: 느리게 바뀌는 부드러운 화음 (D단조 진행)
sound(document.getElementById('hymn'), '성가', (a, out) => {
  const chords = [[50, 57, 62, 65], [46, 53, 58, 62], [53, 57, 60, 65], [48, 55, 60, 64]]; let i = 0;
  const play = () => {
    const t = a.currentTime, g = a.createGain(), lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1100;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.12, t + 3); g.gain.linearRampToValueAtTime(0, t + 9);
    g.connect(lp); lp.connect(out);
    for (const m of chords[i++ % 4]) for (const d of [-4, 4]) {
      const o = a.createOscillator(); o.type = 'triangle'; o.frequency.value = mtof(m); o.detune.value = d; o.connect(g); o.start(t); o.stop(t + 9.2);
    }
  };
  play(); const h = setInterval(play, 7000); return () => clearInterval(h);
});
// 자연 소리: 바람(천천히 세졌다 약해짐) + 가는 빗소리 + 멀리서 지저귀는 새 (리버브 약하게)
sound(document.getElementById('asmr'), '자연 소리 ASMR', (a, out) => {
  const n = a.sampleRate * 6, buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0); let last = 0;
  for (let i = 0; i < n; i++) { const w = Math.random() * 2 - 1; last = (last + .02 * w) / 1.02; d[i] = last * 3.5; }  // 브라운 노이즈
  const white = a.createBuffer(1, n, a.sampleRate), wd = white.getChannelData(0);
  for (let i = 0; i < n; i++) wd[i] = Math.random() * 2 - 1;
  const loop = b => { const s = a.createBufferSource(); s.buffer = b; s.loop = true; s.start(); return s; };
  const nodes = [];
  const wind = loop(buf), wlp = a.createBiquadFilter(), wg = a.createGain();
  wlp.type = 'lowpass'; wlp.frequency.value = 500; wg.gain.value = .5; wind.connect(wlp); wlp.connect(wg); wg.connect(out);
  const gust = a.createOscillator(), gf = a.createGain(), gg = a.createGain();
  gust.frequency.value = .08; gf.gain.value = 300; gg.gain.value = .25; gust.connect(gf); gf.connect(wlp.frequency); gust.connect(gg); gg.connect(wg.gain);
  const rain = loop(white), hp = a.createBiquadFilter(), rg = a.createGain();
  hp.type = 'highpass'; hp.frequency.value = 4000; rg.gain.value = .03; rain.connect(hp); hp.connect(rg); rg.connect(out);
  nodes.push(wind, gust, rain);
  const chirp = () => {
    const t0 = a.currentTime, pan = a.createStereoPanner(), g = a.createGain(), base = 2400 + Math.random() * 2400;
    pan.pan.value = Math.random() * 1.6 - .8; g.connect(pan); pan.connect(out);
    const notes = 2 + (Math.random() * 4 | 0);
    for (let i = 0; i < notes; i++) {
      const t = t0 + i * (.09 + Math.random() * .05), o = a.createOscillator();
      o.frequency.setValueAtTime(base * (1 + Math.random() * .1), t); o.frequency.exponentialRampToValueAtTime(base * (1.25 + Math.random() * .3), t + .07);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.025, t + .01); g.gain.linearRampToValueAtTime(0, t + .08);
      o.connect(g); o.start(t); o.stop(t + .1);
    }
  };
  let h; const next = () => { chirp(); h = setTimeout(next, 1500 + Math.random() * 4500); }; next();
  return () => { clearTimeout(h); nodes.forEach(x => { try { x.stop(); } catch (e) {} }); };
}, .15);
